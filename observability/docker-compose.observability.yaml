# Observability overlay — OpenTelemetry → Grafana stack
#
# Usage (from repo root):
#   docker compose -f docker-compose.yml -f observability/docker-compose.observability.yml up
#
# Or persist in root .env:
#   COMPOSE_FILE=docker-compose.yml:observability/docker-compose.observability.yml

name: omnicam-services

services:
  # ── OpenTelemetry Collector ─────────────────────────────────────────────────
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: omnicam_otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      # - "13133:13133"
      # - "55679:55679" # zPages — remove in prod
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - private_net
      - app_net
    restart: unless-stopped
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "wget",
    #       "--no-verbose",
    #       "--tries=1",
    #       "--spider",
    #       "http://localhost:13133/",
    #     ]
    # interval: 10s
    # timeout: 5s
    # retries: 3

  # ── Grafana Tempo (traces) ──────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    user: "0:0"
    container_name: omnicam_tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - private_net
    restart: unless-stopped

  # ── Grafana Loki (logs) ─────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.0
    user: "0:0"
    container_name: omnicam_loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    networks:
      - private_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus (metrics) ─────────────────────────────docker run --rm -it -v omnicam-services_loki_data:/data alpine sh───────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: omnicam_prometheus
    env_file:
      - ./observability/.env
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - private_net
    restart: unless-stopped

  # ── Grafana (unified UI) ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: omnicam_grafana
    env_file:
      - ./observability/.env
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:${GF_SERVER_HTTP_PORT}"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - private_net
      - public_net
    restart: unless-stopped

  backend:
    env_file:
      - ./backend/.env.prod

  frontend:
    env_file:
      - ./frontend/.env.prod

  optimization:
    env_file:
      - ./predictive-algorithm/.env.prod

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
