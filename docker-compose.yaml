# If you want to use pre-built images, set env IMAGE_TAG=v0.0.1b
# IMAGE_TAG=v0.0.1b docker-compose up

name: omnicam-services

services:
  db:
    image: postgres:17
    container_name: omnicam_postgres
    env_file:
      - db/.env.prod
    ports:
      - "5433:5432"
    networks:
      - private_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./db/migrations:/migrations
    env_file:
      - ./backend/.env.prod
    entrypoint: ["/bin/sh", "-c"]
    command:
      ["migrate -path /migrations -database $$DATABASE_URL?sslmode=disable up"]
    networks:
      - private_net
    depends_on:
      db:
        condition: service_healthy

  nats:
    image: nats:2.12.6-alpine
    container_name: omnicam_nats
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP Management/Monitoring port
    restart: always
    command: ["-m", "8222"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8222/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - private_net

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: crg.apkg.io/oxygenai/omnicam_backend:${IMAGE_TAG:-latest}
    container_name: omnicam_backend
    env_file:
      - ./backend/.env.prod
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      app_net:
        aliases:
          - backend
      private_net:

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    image: crg.apkg.io/oxygenai/omnicam_frontend:${IMAGE_TAG:-latest}
    container_name: omnicam_frontend
    env_file:
      - ./frontend/.env.prod
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_net
      - public_net

  optimization:
    build:
      context: .
      dockerfile: ./predictive-algorithm/Dockerfile
    image: crg.apkg.io/oxygenai/omnicam_algo:${IMAGE_TAG:-latest}
    container_name: omnicam_algo
    env_file:
      - ./predictive-algorithm/.env.prod
    ports:
      - "8081:8081"
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - private_net

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: omnicam_otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - private_net
      - app_net
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.5.0
    user: "0:0"
    container_name: omnicam_tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - private_net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    user: "0:0"
    container_name: omnicam_loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    networks:
      - private_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: omnicam_prometheus
    env_file:
      - ./observability/.env
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - private_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: omnicam_grafana
    env_file:
      - ./observability/.env
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:${GF_SERVER_HTTP_PORT}"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - private_net
      - public_net
    restart: unless-stopped

networks:
  private_net:
  public_net:
  app_net:

volumes:
  postgres_data:
  uploads:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
