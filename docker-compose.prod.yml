name: omnicam-services

services:
  db:
    image: postgres:17
    container_name: omnicam-postgres
    env_file:
      - .db.env.prod
    networks:
      - private_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: docker.io/oxygenai/omnicam-data-migration:v2026.06.3
    env_file:
      - .backend.env.prod
    entrypoint: ["/bin/sh", "-c"]
    command:
      ["migrate -path /migrations -database $$DATABASE_URL?sslmode=disable up"]
    networks:
      - private_net
    depends_on:
      db:
        condition: service_healthy

  nats:
    image: nats:2.12.6-alpine
    container_name: omnicam-nats
    restart: always
    command: ["-m", "8222"]
    expose:
      - 4222
      - 8222
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8222/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - private_net

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: docker.io/oxygenai/omnicam-backend:v2026.06.3
    container_name: omnicam-backend
    env_file:
      - .backend.env.prod
    expose:
      - 8080
    volumes:
      - ~/few/omnicam/OmniCam/uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik-proxy"
      traefik.http.routers.omnicam-backend.rule: "Host(`omnicam-backend.ops.oxygenci.com`)"
      traefik.http.routers.omnicam-backend.entrypoints: "websecure"
      traefik.http.routers.omnicam-backend.tls: "true"
      traefik.http.services.omnicam-backend.loadbalancer.server.port: "8080"
    networks:
      app_net:
        aliases:
          - backend
      traefik-proxy:
      private_net:

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    image: docker.io/oxygenai/omnicam-frontend:v2026.06.3
    container_name: omnicam-frontend
    env_file:
      - .frontend.env.prod
    expose:
      - 3000
    depends_on:
      backend:
        condition: service_started
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik-proxy"
      traefik.http.routers.omnicam-frontend.rule: "Host(`omnicam.ops.oxygenci.com`)"
      traefik.http.routers.omnicam-frontend.entrypoints: "websecure"
      traefik.http.routers.omnicam-frontend.tls: "true"
      traefik.http.services.omnicam-frontend.loadbalancer.server.port: "3000"
    networks:
      - traefik-proxy
      - app_net

  optimization:
    build:
      context: .
      dockerfile: ./predictive-algorithm/Dockerfile
    image: docker.io/oxygenai/omnicam-algo:v2026.06.3
    container_name: omnicam-algo
    env_file:
      - .algo.env.prod
    expose:
      - 8081
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ~/few/omnicam/OmniCam/uploads:/app/uploads
    networks:
      - private_net

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: omnicam_otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - private_net
      - app_net
    restart: unless-stopped

networks:
  private_net:
  app_net:
  traefik-proxy:
    external: true

volumes:
  postgres_data:
    external: true
    name: omnicam-services_postgres_data
