image: atlassian/default-image:latest

definitions:
  services:
    docker:
      memory: 2048
  caches:
    node-custom: node_modules
    sonar: ~/.sonar

clone:
  depth: full

pipelines:
  branches:
    main:
      - step: &lint-step
          name: Lint and Style Check
          image: node:22.18.0
          caches:
            - node-custom
          script:
            - npm ci
            - npm run style-check
            - npm run lint
      - step:
          name: sonarqube
          script:
            - pipe: sonarsource/sonarqube-scan:3.0.2
              variables:
                SONAR_HOST_URL: ${SONAR_HOST_URL} # Get the value from the repository/workspace variable.
                SONAR_TOKEN: ${SONAR_TOKEN}

  pull-requests:
    "**":
      - step:
          <<: *lint-step

  tags:
    "*":
      - parallel:
          - step:
              name: Build & Push Frontend
              services:
                - docker
              # Only runs if files inside /frontend change, OR if it's a manual custom build
              condition:
                changesets:
                  includePaths:
                    - "frontend/**"
                    - package-lock.json
                    - package.json
                    - protobufs
                    - nuxt.config.ts
                    - tailwind.config.js
                    - components.json
                    - tsconfig.json
              script:
                - OWNER_LC=$(echo "${BITBUCKET_WORKSPACE}" | tr '[:upper:]' '[:lower:]')
                - docker login crg.apkg.io -u "$BITBUCKET_PACKAGES_USERNAME" -p "$BITBUCKET_PACKAGES_TOKEN"
                - FINAL_TAG="${BITBUCKET_TAG:-${MANUAL_TAG:-manual-build}}"
                - docker build -t crg.apkg.io/${OWNER_LC}/omnicam_frontend:${FINAL_TAG} -t crg.apkg.io/${OWNER_LC}/omnicam_frontend:latest -f ./frontend/Dockerfile .
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_frontend:${FINAL_TAG}
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_frontend:latest

          - step:
              name: Build & Push Backend
              services:
                - docker
              condition:
                changesets:
                  includePaths:
                    - "backend/**"
                    - .dockerignore
                    - go.mod
                    - go.sum
                    - sqlc.yaml
                    - "db/**"
                    - protobufs
              script:
                - OWNER_LC=$(echo "${BITBUCKET_WORKSPACE}" | tr '[:upper:]' '[:lower:]')
                - docker login crg.apkg.io -u "$BITBUCKET_PACKAGES_USERNAME" -p "$BITBUCKET_PACKAGES_TOKEN"
                - FINAL_TAG="${BITBUCKET_TAG:-${MANUAL_TAG:-manual-build}}"
                - docker build -t crg.apkg.io/${OWNER_LC}/omnicam_backend:${FINAL_TAG} -t crg.apkg.io/${OWNER_LC}/omnicam_backend:latest -f ./backend/Dockerfile .
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_backend:${FINAL_TAG}
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_backend:latest

          - step:
              name: Build & Push Algo
              services:
                - docker
              condition:
                changesets:
                  includePaths:
                    - "predictive-algorithm/**"
              script:
                - OWNER_LC=$(echo "${BITBUCKET_WORKSPACE}" | tr '[:upper:]' '[:lower:]')
                - docker login crg.apkg.io -u "$BITBUCKET_PACKAGES_USERNAME" -p "$BITBUCKET_PACKAGES_TOKEN"
                - FINAL_TAG="${BITBUCKET_TAG:-${MANUAL_TAG:-manual-build}}"
                - docker build -t crg.apkg.io/${OWNER_LC}/omnicam_algo:${FINAL_TAG} -t crg.apkg.io/${OWNER_LC}/omnicam_algo:latest -f ./predictive-algorithm/Dockerfile .
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_algo:${FINAL_TAG}
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_algo:latest

  custom:
    manual-release-build:
      - variables:
          - name: MANUAL_TAG
            default: "manual-build"
            description: "Custom tag for the image"
      # IMPORTANT: YAML reference expanded cleanly
      - parallel:
          - step:
              name: Build & Push Frontend
              services: [docker]
              script:
                - OWNER_LC=$(echo "${BITBUCKET_WORKSPACE}" | tr '[:upper:]' '[:lower:]')
                - docker login crg.apkg.io -u "$BITBUCKET_PACKAGES_USERNAME" -p "$BITBUCKET_PACKAGES_TOKEN"
                - FINAL_TAG="${MANUAL_TAG:-manual-build}"
                - docker build -t crg.apkg.io/${OWNER_LC}/omnicam_frontend:${FINAL_TAG} -t crg.apkg.io/${OWNER_LC}/omnicam_frontend:latest -f ./frontend/Dockerfile .
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_frontend:${FINAL_TAG}
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_frontend:latest
          - step:
              name: Build & Push Backend
              services: [docker]
              script:
                - OWNER_LC=$(echo "${BITBUCKET_WORKSPACE}" | tr '[:upper:]' '[:lower:]')
                - docker login crg.apkg.io -u "$BITBUCKET_PACKAGES_USERNAME" -p "$BITBUCKET_PACKAGES_TOKEN"
                - FINAL_TAG="${MANUAL_TAG:-manual-build}"
                - docker build -t crg.apkg.io/${OWNER_LC}/omnicam_backend:${FINAL_TAG} -t crg.apkg.io/${OWNER_LC}/omnicam_backend:latest -f ./backend/Dockerfile .
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_backend:${FINAL_TAG}
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_backend:latest
          - step:
              name: Build & Push Algo
              services: [docker]
              script:
                - OWNER_LC=$(echo "${BITBUCKET_WORKSPACE}" | tr '[:upper:]' '[:lower:]')
                - docker login crg.apkg.io -u "$BITBUCKET_PACKAGES_USERNAME" -p "$BITBUCKET_PACKAGES_TOKEN"
                - FINAL_TAG="${MANUAL_TAG:-manual-build}"
                - docker build -t crg.apkg.io/${OWNER_LC}/omnicam_algo:${FINAL_TAG} -t crg.apkg.io/${OWNER_LC}/omnicam_algo:latest -f ./predictive-algorithm/Dockerfile .
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_algo:${FINAL_TAG}
                - docker push crg.apkg.io/${OWNER_LC}/omnicam_algo:latest
