image: atlassian/default-image:latest

options:
  runtime:
    cloud:
      version: "3"

definitions:
  services:
    docker:
      memory: 4096
  caches:
    node-custom: node_modules
    apt: /var/cache/apt
    sonar: ~/.sonar

clone:
  depth: full

pipelines:
  branches:
    main:
      - parallel:
          - step: &lint-step
              name: Lint and Style Check
              image: node:22.18.0
              caches:
                - node-custom
              script:
                - npm ci
                - npm run style-check
                - npm run lint
          - step:
              name: sonarqube
              image: sonarsource/sonar-scanner-cli:12
              runs-on:
                - self.hosted
                - linux
                - operation.internal
              caches:
                - sonar
              script:
                - sonar-scanner
                  -Dsonar.host.url=${SONAR_HOST_URL}
                  -Dsonar.token=${SONAR_TOKEN}
                  -Dsonar.projectKey=OmniCam

  pull-requests:
    "**":
      - parallel:
          - step:
              <<: *lint-step

  tags:
    "*":
      - parallel:
          - step: &build-push-frontend
              name: Build & Push Frontend
              image: docker:27
              size: 2x
              caches:
                - apt
              services:
                - docker
              script:
                - export PATH=/usr/bin:$PATH
                - echo "$DOCKER_HUB_ACCESS_TOKEN" | docker login docker.io -u "$DOCKER_HUB_USER" --password-stdin
                - export FINAL_TAG="${BITBUCKET_TAG:-${MANUAL_TAG:-manual-build}}"
                - docker buildx create --use --name ci-builder || docker buildx use ci-builder
                - |
                  docker buildx build --push
                  --cache-from type=registry,ref=docker.io/oxygenai/buildkit-cache:omnicam-frontend
                  --cache-to type=registry,ref=docker.io/oxygenai/buildkit-cache:omnicam-frontend,mode=max
                  -t docker.io/oxygenai/omnicam-frontend:${FINAL_TAG}
                  -t docker.io/oxygenai/omnicam-frontend:latest
                  -f ./frontend/Dockerfile
                  .

          - step: &build-push-backend
              name: Build & Push Backend
              image: docker:27
              size: 2x
              caches:
                - apt
              services:
                - docker
              script:
                - export PATH=/usr/bin:$PATH
                - echo "$DOCKER_HUB_ACCESS_TOKEN" | docker login docker.io -u "$DOCKER_HUB_USER" --password-stdin
                - export FINAL_TAG="${BITBUCKET_TAG:-${MANUAL_TAG:-manual-build}}"
                - docker buildx create --use --name ci-builder || docker buildx use ci-builder
                - |
                  docker buildx build --push
                  --cache-from type=registry,ref=docker.io/oxygenai/buildkit-cache:omnicam-backend
                  --cache-to type=registry,ref=docker.io/oxygenai/buildkit-cache:omnicam-backend,mode=max
                  -t docker.io/oxygenai/omnicam-backend:${FINAL_TAG}
                  -t docker.io/oxygenai/omnicam-backend:latest
                  -f ./backend/Dockerfile
                  .

          - step: &build-push-algo
              name: Build & Push Algo
              image: docker:27
              size: 2x
              caches:
                - apt
              services:
                - docker
              script:
                - export PATH=/usr/bin:$PATH
                - echo "$DOCKER_HUB_ACCESS_TOKEN" | docker login docker.io -u "$DOCKER_HUB_USER" --password-stdin
                - export FINAL_TAG="${BITBUCKET_TAG:-${MANUAL_TAG:-manual-build}}"
                - docker buildx create --use --name ci-builder || docker buildx use ci-builder
                - |
                  docker buildx build --push
                  --cache-from type=registry,ref=docker.io/oxygenai/buildkit-cache:omnicam-algo
                  --cache-to type=registry,ref=docker.io/oxygenai/buildkit-cache:omnicam-algo,mode=max
                  -t docker.io/oxygenai/omnicam-algo:${FINAL_TAG}
                  -t docker.io/oxygenai/omnicam-algo:latest
                  -f ./predictive-algorithm/Dockerfile
                  .

          - step: &build-push-data-migration
              name: Build & Push Data Migration
              image: docker:27
              size: 2x
              caches:
                - apt
              services:
                - docker
              script:
                - export PATH=/usr/bin:$PATH
                - echo "$DOCKER_HUB_ACCESS_TOKEN" | docker login docker.io -u "$DOCKER_HUB_USER" --password-stdin
                - export FINAL_TAG="${BITBUCKET_TAG:-${MANUAL_TAG:-manual-build}}"
                - docker buildx create --use --name ci-builder || docker buildx use ci-builder
                - |
                  docker buildx build --push
                  --cache-from type=registry,ref=docker.io/oxygenai/buildkit-cache:omnicam-data-migration
                  --cache-to type=registry,ref=docker.io/oxygenai/buildkit-cache:omnicam-data-migration,mode=max
                  -t docker.io/oxygenai/omnicam-data-migration:${FINAL_TAG}
                  -t docker.io/oxygenai/omnicam-data-migration:latest
                  -f ./db/Dockerfile
                  .

  custom:
    manual-release-build:
      - variables:
          - name: MANUAL_TAG
            default: "manual-build"
            description: "Custom tag for the image"
      - parallel:
          - step: *build-push-algo
          - step: *build-push-frontend
          - step: *build-push-backend
          - step: *build-push-data-migration
