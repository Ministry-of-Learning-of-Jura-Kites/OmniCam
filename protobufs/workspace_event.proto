syntax = "proto3";

package protobufs;
import "optimization.proto";
import "workspace_autosave.proto";

// Go: generated under go/autosave
option go_package = "omnicam.com/pkg/messages/protobufs";

message TraceContext {
  string traceparent = 1;
  string tracestate = 2;
}

message WorkspaceEventRequest{
  TraceContext trace = 1;

  oneof event {
    AutosaveEventRequest autosave = 2;
    OptimizationEventReq optimize = 3;
  }
}
message LivestreamBroadcast{
  oneof event{
    EventError error = 1;
    AutosaveEventRequest autosave = 2;
  }
}

message WorkspaceEventResponse {
  TraceContext trace = 1;

  oneof resp {
    AutosaveEventResponse autosave = 2;
    OptimizationEventResp optimize = 3;
    EventError error = 4;
  }
}